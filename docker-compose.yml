version: '3.8'

services:
    app:
        build:
            context: ./docker/php
        container_name: apiato_app
        volumes:
            - ./src:/var/www
        working_dir: /var/www
        networks:
            - app-network
        depends_on:
            - db

    nginx:
        image: nginx:stable
        container_name: apiato_nginx
        ports:
            - "8000:80"
        volumes:
            - ./src:/var/www
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
        networks:
            - app-network

    db:
        image: postgres:17
        container_name: apiato_db
        restart: always
        environment:
            POSTGRES_DB: apiato_db
            POSTGRES_USER: apiato_user
            POSTGRES_PASSWORD: admin
        ports:
            - "5433:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
        networks:
            - app-network

volumes:
    pgdata:

networks:
    app-network:
        driver: bridge
